# evidence: readings that support it. Each item needs a cited reading of one of the channels
#   inside the window (seconds, inclusive). `any_of` = one reading from the list is enough.
# misconceptions: hypothesis code -> misconception id shown as a targeted redirect.

EX-01:
  leak_terms: [תוספת עומס, העומס עלה, העומס גדל, עליית עומס, עליית העומס, הגדלת עומס, הגדלת העומס, עומס נוסף, העומס השתנה, מומנט העומס השתנה]  # the mentor may never write these
  check_answer: 0  # index of the correct choice in the theory check question
  cause: H-LOAD
  evidence:
    - {any_of: [f_drive_hz], window: [0, 10], label: תדר יציאה לפני}
    - {any_of: [f_drive_hz], window: [16, 22], label: תדר יציאה אחרי}
    - {any_of: [torque_nm, i_u_rms_a, i_v_rms_a, i_w_rms_a], window: [16, 22], label: מומנט או זרם אחרי}
  misconceptions: {H-FREQ: M-01, H-CMD: M-05, H-SUPPLY: M-06}
  conclusion: תדר נשאר 50 Hz, מומנט עלה מ־0.65 ל־1.55 N·m. תוספת עומס.

EX-02:
  leak_terms: [חסר ברכישה, תקלה ברכישה, בעיית רכישה, לא נקלט, תקלת מדידה]  # the mentor may never write these
