# Every push and pull request: server tests, typed web build, browser smoke test, image build.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: |
          pip install -r apps/api/requirements.txt
          (cd apps/web && npm ci --no-audit --no-fund)
      - name: Server tests
        working-directory: apps/api
        run: python -m pytest -q
      - name: Web build (type check + bundle)
        working-directory: apps/web
        run: npm run build
      - name: Browser smoke test
        env:
          STATE_DIR: ${{ runner.temp }}/state
          DEMO: "1"
          COOKIE_SECURE: "0"
          REPLAY_SPEED: "20"
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          (cd apps/api && python -m uvicorn lab.app:app --port 8000 > "$RUNNER_TEMP/server.log" 2>&1 &)
          for i in $(seq 40); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 0.5; done
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/e2e/smoke.cjs || { cat "$RUNNER_TEMP/server.log"; exit 1; }

  image:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t lab-mentor:ci .
      - name: Start it in production mode and check health
        run: |
          docker run -d --name lm -p 8000:8000 -e DEMO=0 -e COOKIE_SECURE=1 lab-mentor:ci
          for i in $(seq 40); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/teacher/lessons)" = 401
          docker logs lm
