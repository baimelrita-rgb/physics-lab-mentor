misconception_redirects:
  M-01: לפני שמסיקים שהתדר ירד, כדאי לבדוק מה הווסת מדווח. איזה ערוץ מראה את תדר היציאה?
  M-02: ערוץ ריק הוא מדידה חסרה. מה עשו הערוצים השכנים באותן שניות?
  M-03: מתי נמדד הערך שעליו אתם מתבססים? השוו את זמן המקור לשעון ההרצה.
  M-05: פקודת התדר היא מה שביקשו מהווסת. מה הווסת מספק בפועל?
  M-06: זרם הרשת נמדד בכניסת הווסת. איזה ערוץ מודד את הזרם שמגיע למנוע?
