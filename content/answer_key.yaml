  cause: H-MISSING
  evidence:
    - {any_of: [i_u_rms_a, i_w_rms_a], window: [12, 20], label: זרם U או W במהלך הפער}
    - {any_of: [i_v_rms_a], window: [12, 20], label: ערוץ V במהלך הפער}
  misconceptions: {H-LOAD: M-02, H-SUPPLY: M-02}
  conclusion: חסר ברכישה. U ו־W נשארו 0.730/0.731 A, אין בסיס לאובדן פאזה. V חוזר בשנייה 22.

EX-03:
  leak_terms: [קריאה ישנה, המהירות קפואה, ערך קפוא, לא התעדכנה, לא מתעדכנת]  # the mentor may never write these
  check_answer: 1  # index of the correct choice in the theory check question
  cause: H-STALE
  evidence:
    - {any_of: [speed_rpm], window: [10, 18], label: מהירות בזמן הרמפה}
    - {any_of: [f_drive_hz], window: [10, 18], label: תדר יציאה בזמן הרמפה}
  misconceptions: {H-LOAD: M-03, H-FREQ: M-03}
